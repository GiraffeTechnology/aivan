<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/myaivan.css">
</head>
<body class="mv-work-body" data-email-status="{{ email_status }}">
  <header class="mv-header">
    <a class="mv-header-brand" href="/myaivan">myaivan</a>
    <span class="mv-header-sub" data-i18n="work.brand_sub">AIVAN digital trade assistant</span>
    <div class="mv-lang-switch" title="Switch language" data-i18n-title="lang.tooltip">
      <span class="mv-lang-icon" aria-hidden="true">🌐</span>
      <select id="lang-select" aria-label="Switch language"></select>
    </div>
    <button id="backup-btn" class="mv-header-action" title="Backup Case"
            data-i18n="work.backup" data-i18n-title="work.backup_tooltip">Backup</button>
  </header>

  <!-- Top area: conversation stream -->
  <section id="conversation-stream" class="mv-stream" aria-label="Conversation stream"></section>

  <!-- Middle area: generated outbound review -->
  <section id="review-area" class="mv-review" aria-label="Generated outbound review">
    <div class="mv-review-title" data-i18n="work.review_title">Outbound review</div>
    <div id="draft-cards" class="mv-draft-cards">
      <div class="mv-review-empty" data-i18n="work.review_empty">
        AIVAN-generated outbound drafts will appear here for your review.
        Every outbound message requires human confirmation.
      </div>
    </div>
  </section>

  <!-- Bottom area: input bar -->
  <footer class="mv-inputbar">
    <div class="mv-input-actions">
      <button id="paste-btn" title="Paste from clipboard"
              data-i18n="work.paste" data-i18n-title="work.paste_tooltip">Paste</button>
      <label class="mv-upload-label" title="Upload file">
        <span data-i18n="work.upload_file">Upload file</span>
        <input id="file-input" type="file" hidden>
      </label>
      <label class="mv-upload-label" title="Upload image">
        <span data-i18n="work.upload_image">Upload image</span>
        <input id="image-input" type="file" accept="image/*" hidden>
      </label>
      <button id="voice-btn" title="Voice input coming soon"
              data-i18n="work.voice" data-i18n-title="work.voice_tooltip">Voice</button>
    </div>
    <div class="mv-input-row">
      <textarea id="message-input" rows="2"
        placeholder="Paste a buyer inquiry, supplier reply, or tell AIVAN what to handle next..."
        data-i18n-placeholder="work.placeholder"></textarea>
      <button id="send-btn" class="mv-send-btn" data-i18n="work.send">Send</button>
    </div>
    <div id="status-line" class="mv-status-line"></div>
  </footer>

  <!-- Email confirmation modal -->
  <div id="email-modal" class="mv-modal" hidden>
    <div class="mv-modal-box">
      <h3 data-i18n="email.modal_title">Send by Email</h3>
      <p id="email-modal-note" class="mv-modal-note"></p>
      <label><span data-i18n="email.recipient">Recipient</span>
        <input id="email-recipient" type="email" placeholder="partner@example.com">
      </label>
      <div class="mv-modal-actions">
        <button id="email-confirm" class="mv-primary" data-i18n="email.confirm">Confirm send</button>
        <button id="email-cancel" data-i18n="email.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/static/myaivan-i18n.js"></script>
  <script src="/static/myaivan.js"></script>
</body>
</html>
