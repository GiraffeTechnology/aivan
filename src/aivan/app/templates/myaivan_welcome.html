<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/myaivan.css?v=20260709-tight-logo-2">
</head>
<body class="mv-welcome-body">
  <div class="mv-lang-switch mv-lang-floating" title="Switch language" data-i18n-title="lang.tooltip">
    <span class="mv-lang-icon" aria-hidden="true">🌐</span>
    <select id="lang-select" aria-label="Switch language"></select>
  </div>
  <main class="mv-welcome">
    <img class="mv-giraffe-icon mv-giraffe-icon-home" src="/static/giraffe-icon-tight.png" alt="Giraffe Technology logo">
    <div class="mv-logo">AIVAN</div>
    <h1 class="mv-welcome-title" data-i18n="welcome.title">Welcome back. What should your AIVAN handle today?</h1>
    <p class="mv-tagline" data-i18n="welcome.tagline">
      MyAIVAN is your AIVAN digital trade assistant for inquiry management, business
      communication, and human-confirmed outbound messages.
    </p>
    <a id="start-working" class="mv-start-btn" href="/myaivan/work" data-i18n="welcome.start">Start Working</a>
  </main>
  <script src="/static/myaivan-i18n.js"></script>
</body>
</html>
