name: Deployment quarantine record (no deployment)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable 40-character candidate commit SHA"
        required: true
        type: string
      authorization_reference:
        description: "Approved change/authorization reference (metadata only)"
        required: true
        type: string
      target_environment:
        description: "Recorded target; this workflow never connects to it"
        required: true
        default: ctyun-aivan
        type: choice
        options:
          - ctyun-aivan

permissions:
  contents: read

concurrency:
  group: deployment-quarantine-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record-only:
    name: Validate authorization record without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha must be a full lowercase Git SHA"
            exit 1
          }
          [[ -n "$AUTHORIZATION_REFERENCE" ]] || {
            echo "::error::authorization_reference is required"
            exit 1
          }

      - name: Record quarantine constraints
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          {
            echo "## AIVAN deployment quarantine record"
            echo ""
            echo "- candidate_sha: \`$CANDIDATE_SHA\`"
            echo "- authorization_reference: \`$AUTHORIZATION_REFERENCE\`"
            echo "- target_environment: \`$TARGET_ENVIRONMENT\`"
            echo "- deployment_performed: \`false\`"
            echo "- secrets_read: \`false\`"
            echo "- remote_connections_opened: \`false\`"
            echo "- protected_ports_443_8443_touched: \`false\`"
            echo "- non_china_traffic_emitted: \`false\`"
            echo ""
            echo "Production deployment remains blocked until Stage 7F approval,"
            echo "environment protection, backup/rollback evidence, Singapore bridge"
            echo "routing, and port-safety preflight are all independently satisfied."
          } >> "$GITHUB_STEP_SUMMARY"
