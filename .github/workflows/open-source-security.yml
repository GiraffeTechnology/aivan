name: Open-source security scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: semgrep
            name: Semgrep CE (Python, JavaScript, TypeScript)
          - scanner: zizmor
            name: zizmor (GitHub Actions)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned scanners
        run: |
          python -m pip install -r tools/security/requirements.txt


      - name: Run scanner and enforce findings, errors, and coverage
        env:
          SCANNER: ${{ matrix.scanner }}
        run: python tools/security/scan.py "$SCANNER"

      - name: Preserve security reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.scanner }}-${{ github.run_id }}
          path: security-reports/${{ matrix.scanner }}/
          if-no-files-found: error
          retention-days: 30
