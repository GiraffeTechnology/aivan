name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      GIRAFFE_DB_CONTRACT_TOKEN: ${{ secrets.GIRAFFE_DB_CONTRACT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.15

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest --tb=short -q
        env:
          AIVAN_LLM_PROVIDER: mock
          OPENCLAW_MOCK_MODE: "true"
          AIVAN_DB_URL: "sqlite:///:memory:"
          AIVAN_REQUIRE_HUMAN_APPROVAL: "true"

      # The DB-contract scanner is owned by giraffe-db (the single source of
      # truth for record-ID conventions). AIVAN does not vendor a copy. When a
      # cross-repo token is configured, CI checks out the giraffe-db scanner and
      # runs it against this repo. When the token is unavailable, CI still
      # enforces AIVAN's consumer-side contract tests in this repository and
      # skips only the optional cross-repo scanner checkout.
      - name: Check out giraffe-db DB-contract scanner (source of truth)
        if: ${{ env.GIRAFFE_DB_CONTRACT_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: GiraffeTechnology/giraffe-db
          path: giraffe-db-contract
          sparse-checkout: scripts/check_unified_data_ids.py
          sparse-checkout-cone-mode: false
          token: ${{ env.GIRAFFE_DB_CONTRACT_TOKEN }}

      - name: Unified giraffe-db data-ID contract scan (giraffe-db-owned)
        if: ${{ env.GIRAFFE_DB_CONTRACT_TOKEN != '' }}
        run: python giraffe-db-contract/scripts/check_unified_data_ids.py --repo .

      - name: Skip giraffe-db scanner when token is unavailable
        if: ${{ env.GIRAFFE_DB_CONTRACT_TOKEN == '' }}
        run: |
          echo "GIRAFFE_DB_CONTRACT_TOKEN is not configured for this workflow run."
          echo "Skipping cross-repo giraffe-db scanner checkout."
          echo "Consumer-side contract tests remain enforced in this repository."

      - name: Validate ClawHub plugin metadata
        run: uv run python scripts/validate_clawhub_aivan_plugin.py

      - name: Run plugin smoke test (offline)
        run: uv run python scripts/run_aivan_openclaw_plugin_smoke_test.py --offline
        env:
          AIVAN_LLM_PROVIDER: mock
          OPENCLAW_MOCK_MODE: "true"

      - name: Compile check (Python files)
        run: python -m compileall src/aivan scripts tests -q

      - name: Check for Unicode / line-ending issues
        run: |
          python - << 'EOF'
          import os, sys

          def has_bidi(text):
              return any(
                  0x200b <= ord(c) <= 0x200f
                  or 0x202a <= ord(c) <= 0x202e
                  or 0x2060 <= ord(c) <= 0x2069
                  or ord(c) == 0xfeff
                  for c in text
              )

          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.venv', '__pycache__', 'node_modules', 'dist')]
              for f in files:
                  if not any(f.endswith(e) for e in ('.py', '.ts', '.md', '.json', '.yml', '.yaml', '.sh')):
                      continue
                  path = os.path.join(root, f)
                  raw = open(path, 'rb').read()
                  issues = []
                  if b'\r\n' in raw:
                      issues.append('CRLF')
                  if raw.startswith(b'\xef\xbb\xbf'):
                      issues.append('BOM')
                  if has_bidi(raw.decode('utf-8', errors='replace')):
                      issues.append('BIDI')
                  if issues:
                      bad.append(f"{','.join(issues)}: {path}")
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('No encoding issues found.')
          EOF

  typescript:
    name: TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw-aivan-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Enforce zero npm vulnerabilities
        run: npm audit --audit-level=low

      - name: TypeScript syntax check
        run: npx tsc --noEmit

      - name: Build and verify committed dist/ matches a fresh build
        run: |
          npm run build
          git diff --exit-code -- dist/ || {
            echo "::error::committed dist/ is stale — run 'npm run build' in integrations/openclaw-aivan-plugin and commit the result";
            exit 1;
          }

      - name: Gateway harness E2E (against the just-built dist/)
        run: npm test

  quality:
    name: Coverage, lint, typing, and static security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.15

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Enforce module size budgets
        run: uv run python scripts/check_module_size_budget.py

      - name: Ruff lint
        run: uvx --from ruff==0.12.4 ruff check src scripts tests

      - name: Mypy safety-boundary type checks
        run: >-
          uvx --from mypy==1.17.0 mypy
          src/aivan/observability/safe_logging.py
          src/aivan/api/authorization.py
          src/aivan/api/serializers.py
          src/aivan/api/relay_routes.py
          src/aivan/execution/rfq_user_control.py
          src/aivan/gpm/packet_store.py
          src/aivan/api/session_auth.py
          src/aivan/api/session_routes.py
          src/aivan/api/workbench_routes.py
          src/aivan/db/schema_validation.py
          src/aivan/observability/metrics.py
          src/aivan/observability/readiness.py
          src/aivan/observability/dependency_probe.py
          src/aivan/observability/mutation_policy.py
          src/aivan/governance/runtime_policy.py
          src/aivan/integrations/gltg_client.py
          src/aivan/integrations/language_skill_client.py
          src/aivan/openclaw/client.py
          src/aivan/openclaw/email_transport.py
          src/aivan/gpm/auth.py
          src/aivan/gpm/giraffe_db_client.py
          src/aivan/gpm/llm_runtime.py
          src/aivan/gpm/persistence_contract.py
          src/aivan/gpm/router.py
          src/aivan/gpm/server.py
          src/aivan/execution/approval_state.py
          src/aivan/risk/search_providers.py
          src/aivan/llm/gateway.py
          scripts/run_stage7f_predeployment.py

      - name: Bandit high-severity security scan
        run: uvx --from bandit==1.8.6 bandit -q -lll -r src/aivan

      - name: Coverage floor
        env:
          AIVAN_LLM_PROVIDER: mock
          OPENCLAW_MOCK_MODE: "true"
          AIVAN_DB_URL: "sqlite:///:memory:"
          AIVAN_REQUIRE_HUMAN_APPROVAL: "true"
        run: >-
          uv run --with pytest-cov==6.2.1 pytest --tb=short -q
          --cov=aivan --cov-report=term-missing --cov-fail-under=75

  dependency-review:
    # Keep the required context name; OSV performs the dependency vulnerability scan.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTELEMETRY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install OSV Scanner 2.6.0 (verified release digest)
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$RUNNER_TEMP/osv-offline" >> "$GITHUB_ENV"
          echo "OSV_RECORD_VALIDATOR=$RUNNER_TEMP/osv-record-validator" >> "$GITHUB_ENV"
      - name: Set up pinned Go for the upstream advisory decoder
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25.8"
          cache: false
      - name: Build the matching OSV record decoder
        working-directory: tools/security/osv-record-validator
        run: |
          go test -mod=readonly ./...
          go build -mod=readonly -buildvcs=false -trimpath -o "$OSV_RECORD_VALIDATOR" .
      - name: Download complete public vulnerability databases (no project data)
        run: |
          set -euo pipefail
          cache="$OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY/osv-scalibr"
          mkdir -p "$cache/PyPI" "$cache/npm"
          curl --fail --silent --show-error --location --retry 3 \
            https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip \
            --dump-header "$cache/PyPI/download-headers.txt" --output "$cache/PyPI/all.zip"
          curl --fail --silent --show-error --location --retry 3 \
            https://osv-vulnerabilities.storage.googleapis.com/npm/all.zip \
            --dump-header "$cache/npm/download-headers.txt" --output "$cache/npm/all.zip"
      - name: OSV offline full lockfile vulnerability and coverage gate
        run: python tools/security/scan.py osv
      - name: Preserve OSV reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-osv-${{ github.run_id }}
          path: security-reports/osv/
          if-no-files-found: error
          retention-days: 30

  stage6-candidate-evidence:
    name: Stage 6 candidate evidence (5 consecutive runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.15

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Run immutable five-pass candidate preflight
        env:
          AIVAN_LLM_PROVIDER: mock
          OPENCLAW_MOCK_MODE: "true"
          AIVAN_DB_URL: "sqlite:///:memory:"
          AIVAN_REQUIRE_HUMAN_APPROVAL: "true"
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run python scripts/run_stage6_acceptance.py
          --config-profile stage6a-ci
          --candidate-commit "$CANDIDATE_SHA"
          --output evidence/stage6-ci.jsonl

      - name: Upload digest-only candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage6-candidate-evidence-${{ github.run_id }}
          path: evidence/stage6-ci.jsonl
          if-no-files-found: error
          retention-days: 30
